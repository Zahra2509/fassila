<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E4FA3">
  <title>فاصيلة · Host</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="page-host">
  <div id="mode-banner" class="mode-banner" hidden></div>

  <header class="topbar">
    <h1 class="logo"><span lang="ar" dir="rtl">فاصيلة</span><small>Host booth</small></h1>
    <span class="who">🎛️ Host</span>
  </header>

  <div class="host-wrap">
    <main class="host-main">
      <section id="winner-banner" class="card winner-banner" hidden>
        <p class="eyebrow">We have a winner</p>
        <h2 id="winner-name"></h2>
      </section>

      <section class="card now-playing">
        <p class="eyebrow" id="phase-label">Now playing</p>
        <div class="big-song" id="big-song">Song 1 of 10</div>
        <div class="secret-title" id="secret-title">…</div>
        <p class="secret-note" id="secret-note">🤫 Only you can see this. Flips CD <span id="cd-num"></span>.</p>
        <div class="host-stats">
          <span class="stat" id="stat-guesses"><b>0</b> guesses in</span>
          <span class="stat" id="stat-announced">Not announced yet</span>
          <span class="stat" id="stat-claims" hidden><b>0</b> got it</span>
        </div>
        <div class="song-dots" id="song-dots" aria-label="Songs announced so far"></div>
      </section>

      <section class="card controls">
        <div class="btn-row">
          <button id="btn-prev" class="btn btn-ghost" type="button">← Previous song</button>
          <button id="btn-next" class="btn btn-ghost" type="button">Next song →</button>
        </div>
        <button id="btn-announce" class="btn btn-primary" type="button">📣 Announce answer</button>
        <button id="btn-final" class="btn btn-primary" type="button">🔤 Start final round</button>
        <p class="hint" id="final-hint"></p>
        <button id="btn-reset" class="btn btn-danger" type="button">Reset game</button>
      </section>
    </main>

    <aside class="host-side">
      <section class="card">
        <h2>Live progress</h2>
        <p class="muted" id="player-count" style="margin-top:-4px">No players yet</p>
        <ul class="board-list" id="board-list"></ul>
      </section>

      <section class="card">
        <h2>Join the party</h2>
        <p class="muted" style="margin-top:-4px">Scan to play on your phone.</p>
        <div class="qr-box" id="qr-box"></div>
        <div class="qr-url" id="qr-url"></div>
        <form class="qr-form" id="qr-form" autocomplete="off">
          <input id="qr-input" type="text" placeholder="https://your-site/play.html" aria-label="Public player URL">
          <button class="btn btn-ghost" type="submit">Save</button>
        </form>
      </section>
    </aside>
  </div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="host.js"></script>
</body>
</html>
